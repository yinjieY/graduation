server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  clients:
    trace-service-url: http://localhost:8081
    block-service-url: http://localhost:8085
  rules:
    refresh-ms: 60000
    initial-delay-ms: 3000