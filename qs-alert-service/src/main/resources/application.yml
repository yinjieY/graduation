spring:
  #  server:(nacos上的配置文件里设置了端口，这里注释掉，避免冲突)
  #    port: 8084
  application:
    name: qs-alert-service
  profiles:
    active: dev
  jmx:
    enabled: false
  config:
    import: optional:nacos:qs-alert-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/yx_alert_engine?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  mail:
    host: smtp.qq.com
    port: 587
    username: 3184631688@qq.com
    password: cnhngbizenaydfab
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 5000

app:
  ai:
    model-path: ${AI_MODEL_PATH:}
    positive-class-index: 1
    output-kind: auto   # auto | logits | prob
  integration:
    trace-freeze-url: http://localhost:9092/trace/qs/%s/status
    block-event-url: http://localhost:9095/block/proof/event
  rules:
    refresh-ms: 10000
    initial-delay-ms: 3000
  notification:
    retry-once: true
    mail:
      enabled: true
      to: admin@example.com
      subject-prefix: "[QS-ALERT]"
      detail-url: http://localhost:5173/#/admin/alert/detail
    sms:
      enabled: false
      gateway-url:
      to:
      api-key:
