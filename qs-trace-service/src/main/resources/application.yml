spring:
#  server:(nacos上的配置文件里设置了端口，这里注释掉，避免冲突)
#    port: 8082
  application:
    name: qs-trace-service
  profiles:
    active: dev
  jmx:
    enabled: false
  config:
    import: optional:nacos:qs-trace-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/yx_trace_core?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  crypto:
    sm2:
      # SM2私钥（用于二维码签名）- 测试环境使用示例密钥，生产环境请通过Nacos注入
      private-key: 00B9AB0B828FF68872F21A837FC303668428DEA11DCD1B24429D0C99E24EED83D5

