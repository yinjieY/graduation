spring:
#  server:(nacos上的配置文件里设置了端口，这里注释掉，避免冲突)
#    port: 8083
  application:
    name: qs-scan-service
  profiles:
    active: dev
  config:
    import: optional:nacos:qs-scan-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/yx_scan_anomaly
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  crypto:
    sm2:
      # SM2公钥（用于验签）- 与trace-service的私钥配对
      public-key: B9C9A6E04E9C91F7BA880429273747D7EF5DDEB0BB2FF6317EB00BEF331A83081
  clients:
    trace-service-url: http://localhost:9092
    alert-service-url: http://localhost:9094
  feature:
    reuse:
      refresh-ms: 120000           # 增量统计刷新间隔（毫秒），测试环境2分钟，生产环境建议300000(5分钟)
      initial-delay-ms: 10000       # 启动后延迟执行时间（毫秒）
      scan-update-lag-seconds: 2    # 快照回退秒数，防止读到"正在写入"的记录
      full-calibration-hour: 3      # 全量校准模式判断小时（配合refresh-ms使用）
      daily-calibration-cron: "0 0 3 * * ?"  # 每日全量校准定时任务（凌晨3点）
  integration:
    alert-evaluate-url: http://localhost:9094/alert/evaluate
