spring:
  #  server:(nacos上的配置文件里设置了端口，这里注释掉，避免冲突)
  #    port: 8085
  application:
    name: qs-block-service
  profiles:
    active: dev
  config:
    import: optional:nacos:qs-block-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/yx_blockchain_proof
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  blockchain:
    provider: fisco3          # fixed for FISCO BCOS 3.6.0
    node-host: 127.0.0.1
    node-port: 20200          # verify with your container's exposed RPC port
    group-id: group0          # keep consistent with chain genesis/config
    chain-id: chain0          # keep consistent with chain genesis/config
    contract-address: "0x31ed5233b81c79d5adddeef991f531a9bbc2ad01"
    tx-timeout-ms: 10000
    confirm-blocks: 1
    cert:
      ca-crt: "E:/CodeSetting/fisco/node/cert/ca.crt"
      sdk-crt: "E:/CodeSetting/fisco/node/cert/sdk.crt"
      sdk-key: "E:/CodeSetting/fisco/node/cert/sdk.key"
