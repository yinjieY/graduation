spring:
  application:
    name: qs-block-service
  profiles:
    active: dev
  config:
    import: optional:nacos:qs-block-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/yx_blockchain_proof
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  blockchain:
    # 连接模式: mock(模拟) / fisco(真实链)
    gateway-mode: fisco

    # 链基础配置
    group-id: group0
    chain-id: chain0
    contract-address: "0x31ed5233b81c79d5adddeef991f531a9bbc2ad01"

    # FISCO-BCOS JSON-RPC配置（连接WSL中的节点）
    fisco:
      # WSL中FISCO节点的JSON-RPC地址
      write-url: http://172.30.147.205:8545
      verify-url: http://172.30.147.205:8545
      # 连接超时(毫秒)
      connect-timeout: 5000
      # 读取超时(毫秒)
      read-timeout: 10000
    
    # Outbox异步上链配置
    outbox:
      max-retries: 3
      retry-backoff-seconds: 10
      dispatch-batch-size: 50