spring:
  application:
    name: qs-block-service
  profiles:
    active: dev
  config:
    import: optional:nacos:qs-block-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3306/yx_blockchain_proof
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  blockchain:
    # 连接模式: mock(模拟) / webase-sdk(WeBASE-SDK)
    gateway-mode: ${APP_BLOCKCHAIN_GATEWAY_MODE:webase-sdk}

    # 链基础配置
    group-id: ${APP_BLOCKCHAIN_GROUP_ID:group1}
    chain-id: ${APP_BLOCKCHAIN_CHAIN_ID:chain0}
    contract-address: ${APP_BLOCKCHAIN_CONTRACT_ADDRESS:0xc80e0d17b44192dd5efec76ba5f21cdf700a648c}

    # WeBASE-SDK配置（通过WeBASE-Front调用链）
    webase:
      # 示例: http://127.0.0.1:5002/WeBASE-Front
      base-url: ${APP_BLOCKCHAIN_WEBASE_BASE_URL:http://192.168.230.131:5002/WeBASE-Front}
      # WeBASE前置账号地址（从WeBASE平台获取）
      user: ${APP_BLOCKCHAIN_WEBASE_USER:0x7c1506354cbdbc63a210dd07e1d7171235f18276}
      # group0/group1 或数字都可
      group-id: ${APP_BLOCKCHAIN_WEBASE_GROUP_ID:${APP_BLOCKCHAIN_GROUP_ID:group1}}
      # 连接超时(毫秒)
      connect-timeout: ${APP_BLOCKCHAIN_WEBASE_CONNECT_TIMEOUT:5000}
      # 读取超时(毫秒)
      read-timeout: ${APP_BLOCKCHAIN_WEBASE_READ_TIMEOUT:10000}
    
    # Outbox异步上链配置
    outbox:
      max-retries: ${APP_BLOCKCHAIN_OUTBOX_MAX_RETRIES:3}
      retry-backoff-seconds: ${APP_BLOCKCHAIN_OUTBOX_RETRY_BACKOFF_SECONDS:10}
      dispatch-batch-size: ${APP_BLOCKCHAIN_OUTBOX_DISPATCH_BATCH_SIZE:50}
